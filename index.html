<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0c10"><title>ONE LIFE — Open World Prototype</title><link rel="stylesheet" href="style.css"></head><body><div id="app">
<header><div class="brand">ONE <b>LIFE</b><span>OPEN WORLD • VERTICAL SLICE</span></div><div class="hud"><span id="clock">LUN 07:30</span><span id="money">€ 320</span><span id="age">17 ANNI</span></div></header>
<main><section class="game"><canvas id="world" width="1280" height="720" tabindex="0" aria-label="Mondo di gioco"></canvas><div class="hint" id="hint">WASD / Frecce per muoverti • E per interagire • F per entrare/uscire dall'auto</div><div class="toast" id="toast"></div></section>
<aside><div class="card"><h3>OGGI</h3><div id="objective"></div></div><div class="card"><h3>STATO</h3><div class="meters" id="meters"></div></div><div class="card"><h3>TELEFONO</h3><div class="phone"><button data-phone="messages">Messaggi <i id="msgBadge">1</i></button><button data-phone="map">Luoghi</button><button data-phone="bank">Banca</button><button data-phone="jobs">Lavoro</button></div></div><div class="card"><h3>MEMORIA</h3><div id="memory" class="memory"></div></div></aside></main>
<div class="modal hidden" id="modal"><div class="modalbox"><button class="x" id="close">×</button><div id="modalContent"></div></div></div>
<div class="controls"><button id="up">▲</button><div><button id="left">◀</button><button id="interact">E</button><button id="right">▶</button></div><button id="down">▼</button><button id="car">AUTO</button></div>
</div><script src="game.js"></script></body></html>
